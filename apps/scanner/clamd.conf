# Private container interface only; never publish 3310 beyond loopback/private network.
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
User clamav
MaxThreads 2
MaxQueue 8
StreamMaxLength 10M
MaxFileSize 20M
MaxScanSize 50M
MaxRecursion 12
MaxFiles 1000
AlertExceedsMax yes
AlertEncrypted yes
CommandReadTimeout 5
ReadTimeout 10
SendBufTimeout 500
ExitOnOOM yes
SelfCheck 60
Bytecode yes
LogTime yes
LogClean no
