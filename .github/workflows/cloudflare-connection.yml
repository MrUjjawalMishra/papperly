name: Cloudflare connection check
on:
  workflow_dispatch:
  push:
    branches: [ops/cloudflare-connection]
permissions:
  contents: read
concurrency:
  group: papperly-cloudflare-connection
  cancel-in-progress: false
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify account and read-only resource access
        run: node scripts/check-cloudflare-connection.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Inspect the already deployed staging Queue consumer and schedule
        run: node scripts/inspect-staging.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-connection
          path: |
            work/cloudflare-connection.json
            work/staging-inspection.json
          retention-days: 3
          if-no-files-found: error
