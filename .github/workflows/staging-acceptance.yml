name: Synthetic staging role, exam and concurrency acceptance
on:
  push:
    branches: [ops/staging-acceptance]
permissions:
  contents: read
concurrency:
  group: papperly-staging-release
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: Cloudflare
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise real Auth and two-school API workflows with isolated synthetic identities
        run: node --import tsx scripts/staging-acceptance.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          STAGING_LOAD_STUDENTS: "50"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-acceptance-evidence
          path: work/staging-acceptance.json
          retention-days: 14
          if-no-files-found: warn
